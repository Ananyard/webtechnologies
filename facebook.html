<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    h1 {
      text-align: right;
      color: #1877f2;
      margin: 20px 40px;
    }

    form {
      background: white;
      width: 300px;
      padding: 40px;
      margin: 60px 40px 0 auto; 
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer
    }

    .login {
      background: #1877f2;
      color: white;
    }

    .create {
      background: #42b72a;
      color: white;
    }

    a {
      text-align: center;
      margin: 10px 0;
      color: #1877f2;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Facebook</h1>

  <form>
    <input type="text" placeholder="Email or phone number" required>
    <input type="password" placeholder="Password" required>
    <button type="submit" class="login">Log In</button>
    <a href="#">Forgotten password?</a>
    <a href="#"> Sign up for Facebook</a>
   
   
  </form>
</body>
</html>
